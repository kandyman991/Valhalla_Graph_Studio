[package]
name = "valhalla-graph-studio"
version = "0.1.0"
description = "Valhalla graph build and inspection workstation (ID-stable graph builder)"
authors = ["kandyman991"]
edition = "2021"

[lib]
name = "valhalla_graph_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.12.1", features = [] }
